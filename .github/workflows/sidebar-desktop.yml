name: Sidebar fork desktop build

# Desktop installers of the sidebar fork ("T3 Code Sidebar"), which installs
# next to upstream T3 Code with its own app id and ~/.t3-sidebar data. Every
# push to `ws` publishes a GitHub release with the installers and the
# electron-updater manifests, so installed apps offer the build as an update.
# Windows embeds the Linux CLI archive as its WSL runtime; that backend keeps
# its data in ~/.t3-sidebar inside the distro. Builds are unsigned.
# The release also carries the Android app (sidebar variant), signed with the
# fork's own key; every APK shares one version code so any of them installs
# over another (Settings › About › Version history on the phone).

on:
  push:
    branches: [ws]
    paths-ignore: ["deploy/**", "docs/**", "**/*.md", ".github/workflows/sidebar-ios.yml"]
  workflow_dispatch:
    inputs:
      android_arch:
        description: "Android ABI(s) to build"
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - arm64-v8a,x86_64

permissions:
  contents: read

concurrency:
  group: sidebar-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Version is all the desktop bundle and the Android APK share. Computing it
  # in its own job lets both start at once instead of the APK waiting for the
  # desktop build just to learn its number.
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            FORK.md
            apps/server/package.json
          sparse-checkout-cone-mode: false

      # Upstream's version plus the run number: semver-ordered so electron-updater
      # sees each build as newer, while the core version stays upstream's so
      # version-skew checks against servers hold. Upstream stamps a release's
      # version only at release time (the tag commit keeps the previous one in
      # package.json), so the core is the higher of package.json and the release
      # tag recorded in FORK.md's "Last synced with upstream release" line.
      - id: version
        run: |
          core="$(node -e '
            const fs = require("node:fs");
            const pkg = require("./apps/server/package.json").version;
            const synced = /Last synced with upstream release `v(\d+\.\d+\.\d+)`/.exec(fs.readFileSync("FORK.md", "utf8"))?.[1];
            const key = (v) => v.replace(/[-+].*$/, "").split(".").map(Number);
            const newer = (a, b) => { const x = key(a), y = key(b); for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] > y[i]; return false; };
            console.log(synced && newer(synced, pkg) ? synced : pkg.replace(/[-+].*$/, ""));
          ')"
          echo "version=$core-sidebar.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  bundle:
    name: Build JS bundle
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - run: node scripts/update-release-package-versions.ts "$VERSION"

      # @t3tools/desktop#build compiles the Linux browser secret helper.
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - run: vp run build:desktop

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Build Linux x64 (and WSL runtime)
    needs: bundle
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.bundle.outputs.version }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - run: node scripts/update-release-package-versions.ts "$VERSION"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: js-bundle
          path: apps

      - name: Build desktop artifact
        run: |
          # GITHUB_REPOSITORY gives the app its update feed: this fork's releases.
          vp run dist:desktop:artifact --platform linux --target AppImage --arch x64 \
            --build-version "$VERSION" --skip-build --verbose

      # The Linux CLI archive is what the Windows build embeds as its WSL runtime.
      - name: Build CLI single-executable
        env:
          # Keep in step with SEA_NODE_VERSION in apps/server/vite.config.ts.
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build CLI archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor \
            "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-linux-x64
          path: release-cli/*
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error

  windows:
    name: Build Windows x64
    needs: [bundle, linux]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.bundle.outputs.version }}
    timeout-minutes: 45
    steps:
      # checkout's credential cleanup trips over the orphaned gitlinks in .repos.
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - shell: bash
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: js-bundle
          path: apps

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-linux-x64
          path: wsl-runtime

      - name: Build desktop artifact
        shell: bash
        run: |
          # GITHUB_REPOSITORY gives the app its update feed: this fork's releases.
          vp run dist:desktop:artifact --platform win --target nsis --arch x64 \
            --build-version "$VERSION" --skip-build --verbose \
            --wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/t3-*-linux-x64.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-win-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  android:
    name: Build Android APK
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ANDROID_ARCH: ${{ inputs.android_arch || 'arm64-v8a' }}
      APP_VARIANT: sidebar
      EXPO_NO_GIT_STATUS: "1"
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=8192
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - run: vp install --filter=@t3tools/mobile...

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          # `ws` is not the repository's default branch, and the action defaults
          # to read-only caches there. Without this, no Gradle build cache is
          # ever saved, so every mobile push recompiles the native modules.
          cache-read-only: false

      # The generated project and the native build outputs are the expensive
      # part. The app's outputs live under `android/`; autolinked modules build
      # inside their own package directories, so cache those too. The key
      # changes only when native inputs change, so JavaScript-only pushes reuse
      # the compiled modules.
      - name: Restore native Android project
        id: android-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/mobile/android
            apps/mobile/modules/**/android/build
            apps/mobile/modules/**/android/.cxx
            node_modules/.pnpm/**/android/build
            node_modules/.pnpm/**/android/.cxx
          key: sidebar-android-v3-${{ hashFiles('apps/mobile/app.config.ts', 'apps/mobile/app.json', 'apps/mobile/plugins/**', 'apps/mobile/modules/**', 'patches/**', 'pnpm-lock.yaml') }}
          restore-keys: |
            sidebar-android-v3-

      - name: Prebuild Android project
        if: steps.android-cache.outputs.cache-hit != 'true'
        run: |
          cd apps/mobile
          npx expo prebuild --platform android --no-install

      # Fork sideload builds are not store builds: one ABI for phones, no R8,
      # no PNG crunching, no lintVital. Those gates cost minutes and are
      # re-enabled by the EAS store profiles, not here.
      - name: Build signed APK
        env:
          T3_SIDEBAR_VERSION: ${{ needs.version.outputs.version }}
          T3_ANDROID_KEYSTORE_BASE64: ${{ secrets.T3_ANDROID_KEYSTORE_BASE64 }}
          T3_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.T3_ANDROID_KEYSTORE_PASSWORD }}
          T3_ANDROID_KEY_ALIAS: ${{ secrets.T3_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          export T3_ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$T3_ANDROID_KEYSTORE_BASE64" | base64 -d > "$T3_ANDROID_KEYSTORE"
          cd apps/mobile/android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures="$ANDROID_ARCH" \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            -Pandroid.enablePngCrunchInReleaseBuilds=false \
            -x lintVitalRelease \
            --build-cache --parallel --max-workers=4
          mkdir -p "$GITHUB_WORKSPACE/release-android"
          cp app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/release-android/T3-Code-Sidebar-$VERSION.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-android
          path: release-android/*.apk
          if-no-files-found: error

  # Checks gate the release: lint, format, typecheck and every package's tests
  # run next to the builds, and "Publish release" waits for them, so a red tree
  # never reaches installed apps. Same commands as upstream's ci.yml, on GitHub's
  # runners (upstream's run on Blacksmith).
  check:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-ci-deps

      - run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check generated GitHub GraphQL operations
        run: vp run --filter @t3tools/source-control-github generate --check

      - name: Check generated Expo GraphQL operations
        run: vp run --filter t3 generate --check

      - name: Lint and format
        run: vp check

      - name: Typecheck
        run: vpr typecheck

  # Everything except apps/server and the web app, which have their own jobs.
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      # The ACP process-tree tests compile a pthread fixture with `cc`; the
      # desktop tests compile the browser secret helper against libsecret.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libsecret-1-dev pkg-config

      - uses: ./.github/actions/setup-ci-deps

      - run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' --filter '!@t3tools/web' test

  test_web:
    name: Test Web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-ci-deps

      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for web browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Test
        run: vp run --filter @t3tools/web test

  # apps/server runs its test files one at a time (fileParallelism: false), so
  # shards spread them over runners, split by recorded duration like upstream's.
  test_server:
    name: Test Server ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-ci-deps

      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/server/node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for server browser integration tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/server/node_modules/playwright-core/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/server/node_modules/playwright-core/cli.js install-deps chromium
          fi

      - name: Test
        run: vp run --filter t3 test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  release:
    name: Publish release
    needs: [bundle, linux, windows, android, check, test, test_web, test_server]
    env:
      VERSION: ${{ needs.bundle.outputs.version }}
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      # A full (non-pre) release marked latest: that is the one electron-updater's
      # GitHub provider reads latest.yml / latest-linux.yml from.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "sidebar-v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "T3 Code Sidebar $VERSION" \
            --notes "Build of the sidebar fork ($GITHUB_SHA). Desktop installers are unsigned and install next to upstream T3 Code: own app id, data in ~/.t3-sidebar; installed apps pick this up as an update. The APK is the Android app (com.gvidon.t3codesidebar)."
