name: Sidebar fork desktop build

on:
  push:
    branches: [ws, delivery-ci/**, ci/a1-timing]
    paths-ignore: ["deploy/**", "docs/**", "**/*.md", ".github/workflows/sidebar-ios.yml"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and collect timings without publishing a release"
        type: boolean
        default: true
      base_ref:
        description: "Compare source paths against this ref (empty builds all)"
        type: string
        default: ""
      android_arch:
        description: "Android ABI(s) to build"
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - arm64-v8a,x86_64

permissions:
  contents: read

concurrency:
  group: sidebar-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Version is all the desktop bundle and the Android APK share. Computing it
  # in its own job lets both start at once instead of the APK waiting for the
  # desktop build just to learn its number.
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      desktop: ${{ steps.paths.outputs.desktop }}
      android: ${{ steps.paths.outputs.android }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: paths
        env:
          BASE_SHA: ${{ github.event.before || inputs.base_ref }}
        run: node scripts/delivery/release-plan.ts

      # Upstream's version plus the run number: semver-ordered so electron-updater
      # sees each build as newer, while the core version stays upstream's so
      # version-skew checks against servers hold. Upstream stamps a release's
      # version only at release time (the tag commit keeps the previous one in
      # package.json), so the core is the higher of package.json and the release
      # tag recorded in FORK.md's "Last synced with upstream release" line.
      - id: version
        run: |
          core="$(node -e '
            const fs = require("node:fs");
            const pkg = require("./apps/server/package.json").version;
            const synced = /Last synced with upstream release `v(\d+\.\d+\.\d+)`/.exec(fs.readFileSync("FORK.md", "utf8"))?.[1];
            const key = (v) => v.replace(/[-+].*$/, "").split(".").map(Number);
            const newer = (a, b) => { const x = key(a), y = key(b); for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] > y[i]; return false; };
            console.log(synced && newer(synced, pkg) ? synced : pkg.replace(/[-+].*$/, ""));
          ')"
          echo "version=$core-sidebar.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  bundle:
    name: Build JS bundle
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .vite-plus
            apps/*/.vite-plus
            packages/*/.vite-plus
            node_modules/.vite
            .turbo
            native/resource-monitor/target
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: delivery-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            delivery-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: node scripts/update-release-package-versions.ts "$VERSION"

      # @t3tools/desktop#build compiles the Linux browser secret helper.
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build server and web
        run: vp run --filter t3 build

      - name: Build desktop shell
        if: needs.version.outputs.desktop == 'true'
        run: vp run --filter @t3tools/desktop build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Build Linux installer
    needs: [version, bundle]
    if: needs.version.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.bundle.outputs.version }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .vite-plus
            apps/*/.vite-plus
            packages/*/.vite-plus
            node_modules/.vite
            .turbo
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: delivery-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            delivery-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - run: node scripts/update-release-package-versions.ts "$VERSION"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: js-bundle
          path: apps

      - name: Build desktop artifact
        run: |
          # GITHUB_REPOSITORY gives the app its update feed: this fork's releases.
          vp run dist:desktop:artifact --platform linux --target AppImage --arch x64 \
            --build-version "$VERSION" --skip-build --verbose

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error

  runtime:
    name: Build server runtime and WSL archive
    needs: [version, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - run: vp install --filter=t3... --filter=@t3tools/scripts...

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .vite-plus
            apps/*/.vite-plus
            packages/*/.vite-plus
            node_modules/.vite
            .turbo
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: delivery-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            delivery-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - run: node scripts/update-release-package-versions.ts "$VERSION"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: js-bundle
          path: apps

      - run: cargo build --locked --release --target x86_64-unknown-linux-gnu --manifest-path native/resource-monitor/Cargo.toml

      - name: Build CLI single-executable
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build CLI archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor \
            "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli

      - name: Runtime checksums
        run: |
          cd release-cli
          sha256sum *.tar.gz > SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-linux-x64
          path: release-cli/*
          if-no-files-found: error

  windows:
    name: Build Windows x64
    needs: [version, bundle, runtime]
    if: needs.version.outputs.desktop == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.bundle.outputs.version }}
    timeout-minutes: 45
    steps:
      # checkout's credential cleanup trips over the orphaned gitlinks in .repos.
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .vite-plus
            apps/*/.vite-plus
            packages/*/.vite-plus
            node_modules/.vite
            .turbo
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: delivery-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            delivery-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - shell: bash
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: js-bundle
          path: apps

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-linux-x64
          path: wsl-runtime

      - name: Build desktop artifact
        shell: bash
        run: |
          # GITHUB_REPOSITORY gives the app its update feed: this fork's releases.
          vp run dist:desktop:artifact --platform win --target nsis --arch x64 \
            --build-version "$VERSION" --skip-build --verbose \
            --wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/t3-*-linux-x64.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-win-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  android:
    name: Build Android APK
    needs: version
    if: needs.version.outputs.android == 'true'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      T3_ANDROID_KEYSTORE_BASE64: ${{ secrets.T3_ANDROID_KEYSTORE_BASE64 }}
      T3_ANDROID_KEY_ALIAS: ${{ secrets.T3_ANDROID_KEY_ALIAS }}
      VERSION: ${{ needs.version.outputs.version }}
      ANDROID_ARCH: ${{ inputs.android_arch || 'arm64-v8a' }}
      APP_VARIANT: sidebar
      EXPO_NO_GIT_STATUS: "1"
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=8192
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - run: vp install --filter=@t3tools/mobile...

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .vite-plus
            apps/*/.vite-plus
            packages/*/.vite-plus
            node_modules/.vite
            .turbo
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: delivery-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            delivery-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          # `ws` is not the repository's default branch, and the action defaults
          # to read-only caches there. Without this, no Gradle build cache is
          # ever saved, so every mobile push recompiles the native modules.
          cache-read-only: ${{ github.ref != 'refs/heads/ws' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Install native compiler cache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Resolve Android native fingerprint
        id: native
        working-directory: apps/mobile
        run: |
          fingerprint=$(pnpm --silent exec expo-updates runtimeversion:resolve --platform android | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const v=JSON.parse(s).runtimeVersion;if(!/^[a-zA-Z0-9.+_-]+$/.test(v))throw Error("Invalid fingerprint");process.stdout.write(v)})')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ccache
          key: android-ccache-${{ runner.os }}-${{ env.ANDROID_ARCH }}-${{ steps.native.outputs.fingerprint }}-${{ github.sha }}
          restore-keys: |
            android-ccache-${{ runner.os }}-${{ env.ANDROID_ARCH }}-${{ steps.native.outputs.fingerprint }}-
            android-ccache-${{ runner.os }}-${{ env.ANDROID_ARCH }}-

      - name: Reuse an identical signed APK from a previous release
        id: reuse-apk
        env:
          T3_ANDROID_FINGERPRINT: ${{ steps.native.outputs.fingerprint }}
        run: node scripts/delivery/android-release.mjs restore release-android

      # The generated project and the native build outputs are the expensive
      # part. The app's outputs live under `android/`; autolinked modules build
      # inside their own package directories, so cache those too. The key
      # changes only when native inputs change, so JavaScript-only pushes reuse
      # the compiled modules.
      - name: Restore native Android project
        id: android-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/mobile/android
            apps/mobile/modules/**/android/build
            apps/mobile/modules/**/android/.cxx
            node_modules/.pnpm/**/android/build
            node_modules/.pnpm/**/android/.cxx
          key: sidebar-android-v4-${{ env.ANDROID_ARCH }}-${{ steps.native.outputs.fingerprint }}
          restore-keys: |
            sidebar-android-v4-${{ env.ANDROID_ARCH }}-

      - name: Prebuild Android project
        if: steps.reuse-apk.outputs.reused != 'true' && steps.android-cache.outputs.cache-hit != 'true'
        run: |
          cd apps/mobile
          npx expo prebuild --platform android --no-install

      # Fork sideload builds are not store builds: one ABI for phones, no R8,
      # no PNG crunching, no lintVital. Those gates cost minutes and are
      # re-enabled by the EAS store profiles, not here.
      - name: Build signed APK
        if: steps.reuse-apk.outputs.reused != 'true'
        env:
          T3_SIDEBAR_VERSION: ${{ needs.version.outputs.version }}
          T3_ANDROID_KEYSTORE_BASE64: ${{ secrets.T3_ANDROID_KEYSTORE_BASE64 }}
          T3_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.T3_ANDROID_KEYSTORE_PASSWORD }}
          T3_ANDROID_KEY_ALIAS: ${{ secrets.T3_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          export T3_ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$T3_ANDROID_KEYSTORE_BASE64" | base64 -d > "$T3_ANDROID_KEYSTORE"
          cd apps/mobile/android
          # The cached native project contains the version from its first prebuild.
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'app/build.gradle';
          const version = process.env.T3_SIDEBAR_VERSION;
          if (!/^\d+\.\d+\.\d+-sidebar\.\d+$/.test(version ?? '')) {
            throw new Error('Missing or invalid sidebar release version');
          }
          const source = fs.readFileSync(path, 'utf8');
          const pattern = /\bversionName\s+(['"])[^'"\r\n]*\1/g;
          if ([...source.matchAll(pattern)].length !== 1) {
            throw new Error('Expected exactly one Android versionName');
          }
          fs.writeFileSync(path, source.replace(pattern, `versionName "${version}"`));
          NODE
          node --input-type=module -e 'import { configureAndroidGradle } from "../../../scripts/delivery/android-build.mjs"; configureAndroidGradle("app/build.gradle")'
          ./gradlew assembleRelease \
            -PreactNativeArchitectures="$ANDROID_ARCH" \
            -Pt3AndroidNativeFingerprint="${{ steps.native.outputs.fingerprint }}" \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            -Pandroid.enablePngCrunchInReleaseBuilds=false \
            -x lintVitalRelease \
            --build-cache --configuration-cache --parallel --max-workers=4 --profile
          mkdir -p "$GITHUB_WORKSPACE/release-android"
          cp app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/release-android/T3-Code-Sidebar-$VERSION.apk"

      - name: Record signed APK inputs
        if: steps.reuse-apk.outputs.reused != 'true'
        env:
          T3_ANDROID_FINGERPRINT: ${{ steps.native.outputs.fingerprint }}
        run: node scripts/delivery/android-release.mjs record release-android

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-android
          path: release-android/*
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.reuse-apk.outputs.reused != 'true'
        with:
          name: android-build-profile
          path: apps/mobile/android/build/reports/profile
          if-no-files-found: ignore

  release:
    name: Publish server runtime first
    needs: [version, runtime]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/ws') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run && github.ref == 'refs/heads/ws')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      DESKTOP_CHANGED: ${{ needs.version.outputs.desktop }}
      ANDROID_CHANGED: ${{ needs.version.outputs.android }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-linux-x64
          path: dist
      - name: Create release with runtime
        run: |
          set -euo pipefail
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"
          {
            printf 'Server runtime for commit %s. Installers are attached as their builds finish.\n\n' "$GITHUB_SHA"
            printf 'Desktop build requested: %s. Android build requested: %s.\n' "$DESKTOP_CHANGED" "$ANDROID_CHANGED"
            if [ -n "$previous" ]; then
              printf 'Unchanged artifacts remain available in the [previous release](https://github.com/%s/releases/tag/%s).\n' "$GITHUB_REPOSITORY" "$previous"
            else
              printf 'No previous release exists; skipped artifacts are unavailable.\n'
            fi
          } > notes.md
          gh release create "sidebar-v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest --title "T3 Code Sidebar $VERSION" --notes-file notes.md

  publish-linux:
    name: Attach linux artifacts
    needs: [version, release, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-linux-x64
          path: dist
      - run: gh release upload "sidebar-v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  publish-windows:
    name: Attach windows artifacts
    needs: [version, release, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-win-x64
          path: dist
      - run: gh release upload "sidebar-v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  publish-android:
    name: Attach android artifacts
    needs: [version, release, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-android
          path: dist
      - run: gh release upload "sidebar-v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  timings:
    name: Record delivery timings
    needs:
      [
        version,
        bundle,
        runtime,
        linux,
        windows,
        android,
        release,
        publish-linux,
        publish-windows,
        publish-android,
      ]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Collect job timestamps
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | {name, conclusion, started_at, completed_at}' > delivery-timings.jsonl
          {
            echo '### Delivery job timestamps'
            echo 'Times below are measured by GitHub, including dry-run builds.'
            echo '```json'
            cat delivery-timings.jsonl
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: delivery-timings
          path: delivery-timings.jsonl
          if-no-files-found: error
