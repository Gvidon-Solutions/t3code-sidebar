name: Sidebar fork desktop build

# Desktop installers of the sidebar fork ("T3 Code Sidebar"), which installs
# next to upstream T3 Code with its own app id and ~/.t3-sidebar data. Every
# push to `ws` publishes a GitHub release with the installers and the
# electron-updater manifests, so installed apps offer the build as an update.
# Windows embeds the Linux CLI archive as its WSL runtime; that backend keeps
# its data in ~/.t3-sidebar inside the distro. Builds are unsigned.

on:
  push:
    branches: [ws]
    paths-ignore: ["deploy/**", "docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sidebar-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Build JS bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # Upstream's version plus the run number: semver-ordered so electron-updater
      # sees each build as newer, while the core version stays upstream's so
      # version-skew checks against servers hold.
      - id: version
        run: |
          version="$(node -p "require('./apps/server/package.json').version")-sidebar.${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - run: node scripts/update-release-package-versions.ts "$VERSION"

      # @t3tools/desktop#build compiles the Linux browser secret helper.
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - run: vp run build:desktop

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Build Linux x64 (and WSL runtime)
    needs: bundle
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.bundle.outputs.version }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - run: node scripts/update-release-package-versions.ts "$VERSION"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: js-bundle
          path: apps

      - name: Build desktop artifact
        run: |
          # GITHUB_REPOSITORY gives the app its update feed: this fork's releases.
          vp run dist:desktop:artifact --platform linux --target AppImage --arch x64 \
            --build-version "$VERSION" --skip-build --verbose

      # The Linux CLI archive is what the Windows build embeds as its WSL runtime.
      - name: Build CLI single-executable
        env:
          # Keep in step with SEA_NODE_VERSION in apps/server/vite.config.ts.
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build CLI archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor \
            "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-linux-x64
          path: release-cli/*
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error

  windows:
    name: Build Windows x64
    needs: [bundle, linux]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.bundle.outputs.version }}
    timeout-minutes: 45
    steps:
      # checkout's credential cleanup trips over the orphaned gitlinks in .repos.
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - shell: bash
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: js-bundle
          path: apps

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-linux-x64
          path: wsl-runtime

      - name: Build desktop artifact
        shell: bash
        run: |
          # GITHUB_REPOSITORY gives the app its update feed: this fork's releases.
          vp run dist:desktop:artifact --platform win --target nsis --arch x64 \
            --build-version "$VERSION" --skip-build --verbose \
            --wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/t3-*-linux-x64.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-win-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  release:
    name: Publish release
    needs: [bundle, linux, windows]
    env:
      VERSION: ${{ needs.bundle.outputs.version }}
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      # A full (non-pre) release marked latest: that is the one electron-updater's
      # GitHub provider reads latest.yml / latest-linux.yml from.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "sidebar-v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "T3 Code Sidebar $VERSION" \
            --notes "Unsigned build of the sidebar fork ($GITHUB_SHA). Installs next to upstream T3 Code: own app id, data in ~/.t3-sidebar. Installed apps pick it up as an update."
