name: Isolated mesh scenarios
on:
  workflow_dispatch:
  push:
    branches: [ws]
  pull_request:
    branches: [ws]
permissions:
  contents: read

jobs:
  mesh-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MESH_FAST_ARTIFACTS_DIR: /data/mf
      MESH_FAST_MUTAGEN_CACHE: /data/mf/tools
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - run: sudo apt-get update && sudo apt-get install -y openssh-server patchelf && sudo mkdir -p /run/sshd
      - run: sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" /data/mf
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /data/mf/tools/mutagen*
            /data/mf/tools/browsers
            /data/mf/tools/previous-*
            /data/mf/tools/toolchain
            native/resource-monitor/target
          key: mesh-fast-tools-v3-${{ runner.os }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'scripts/mesh-fast/previous.mjs') }}
      - run: scripts/mesh-fast/setup.sh
      - id: mesh
        run: pnpm mesh:fast --jobs 2 --budget-seconds 2700
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && steps.mesh.outputs.artifacts != '' }}
        with:
          name: mesh-fast-results
          path: |
            ${{ steps.mesh.outputs.artifacts }}/summary.json
            ${{ steps.mesh.outputs.artifacts }}/runner.json
            ${{ steps.mesh.outputs.artifacts }}/recovery.json
            ${{ steps.mesh.outputs.artifacts }}/retention.json
            ${{ steps.mesh.outputs.artifacts }}/preparation.json
            ${{ steps.mesh.outputs.artifacts }}/junit.xml
            ${{ steps.mesh.outputs.artifacts }}/failure.txt
            ${{ steps.mesh.outputs.artifacts }}/*/failure.txt
            ${{ steps.mesh.outputs.artifacts }}/*/recovery-proof.json
            ${{ steps.mesh.outputs.artifacts }}/*/*.log
            ${{ steps.mesh.outputs.artifacts }}/*/*/*.log
            ${{ steps.mesh.outputs.artifacts }}/*/phases.jsonl
            ${{ steps.mesh.outputs.artifacts }}/*/children.jsonl
            ${{ steps.mesh.outputs.artifacts }}/*/artifacts/shots/*
